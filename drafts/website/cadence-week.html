<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>cadence — week view</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#26262A;font-family:Archivo,sans-serif;padding:44px 20px 120px}
.wrap{max-width:1320px;margin:0 auto}
.intro{color:#C9C7C0;margin-bottom:28px;max-width:74ch}
.intro h1{font-size:27px;font-weight:600;letter-spacing:-.03em;color:#fff;margin-bottom:9px}
.intro p{font-size:14.5px;line-height:1.6}

.scroller{overflow-x:auto;background:#EFEDE6}
.board{
  min-width:1280px;
  --cream:#EFEDE6; --card:#FBFAF5; --ink:#101010; --grn:#1B7F4B; --rust:#AF4A28;
  --dim:#8A8A83; --rule:#B5B1A3; --edge:#D6D2C5;
  background:var(--cream);color:var(--ink);padding:30px 32px 28px;
}
.mast{display:flex;justify-content:space-between;align-items:center}
.mast h3{font-size:12px;font-weight:700;letter-spacing:.34em;text-transform:uppercase}
.mast span{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--dim)}
.rule2{border-bottom:2px solid var(--ink);margin:14px 0 0}

.grid{display:grid;grid-template-columns:84px repeat(7,1fr)}
.dh{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:11px 6px 12px;
  border-right:1px dotted var(--rule)}
.dh b{display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:10px;color:var(--dim);letter-spacing:0;margin-top:2px}
.lbl{border-right:1px dotted var(--rule);padding:0 12px 0 0;display:flex;align-items:flex-start;justify-content:flex-end;
  font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);line-height:60px}
.cell{border-right:1px dotted var(--rule);padding:0 5px;display:flex;flex-direction:column;gap:6px}
.grid>*:nth-child(8n){border-right:none}
.gap{min-height:16px}
.sp{height:10px;border-right:1px dotted var(--rule)}
.sp:nth-child(8n){border-right:none}

.ev{position:relative;height:60px;flex:none;background:var(--card);border:1px solid var(--edge);
    padding:5px 7px 5px 10px;display:flex;flex-direction:column;overflow:hidden}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.ev.meal::before{background:var(--ink)}
.ev.snack::before{background:var(--rust)}
.ev.out::before{background:var(--grn)}
.ev .n{font-size:9px;font-weight:700;line-height:1.2;letter-spacing:0;text-transform:uppercase;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:break-word;height:22px}
.ev.snack .n{color:var(--rust)}
.ev.out .n{color:var(--grn)}
.ev .kc{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;letter-spacing:-.03em;margin-top:5px;line-height:1}
.ev .mc{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--dim);margin-top:3px;line-height:1;white-space:nowrap}
.empty{height:60px;border:1px dashed var(--rule);opacity:.38;flex:none}

.foot{margin-top:24px;border-top:5px solid var(--ink)}
.tbl{display:grid;grid-template-columns:132px repeat(4,1fr);width:100%}
.tbl>div{padding:9px 14px;border-right:1px dotted var(--rule);border-bottom:1px dotted var(--rule);
  font-family:'IBM Plex Mono',monospace;font-size:15px;text-align:right;letter-spacing:-.01em;line-height:1.2}
.tbl>div:nth-child(5n){border-right:none}
.tbl>div:nth-last-child(-n+5){border-bottom:none}
.tbl>div.hd{font-family:Archivo,sans-serif;font-size:8.5px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim);padding-top:13px;padding-bottom:10px}
.tbl>div.rl{font-family:Archivo,sans-serif;font-size:9px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;text-align:left;padding-left:0;color:var(--ink)}
.tbl>div.rl.q{color:var(--dim)}
.tbl .r-avg{font-weight:700;color:var(--ink)}
.tbl .r-tgt{color:var(--dim)}
.tbl .r-dif{font-weight:600}
.tbl .r-dif.ok{color:var(--grn)}
.tbl .r-dif.off{color:var(--rust)}
@media(max-width:1050px){.board{padding:16px}}
</style></head><body>
<div class="wrap">
<div class="intro">
  <h1>Cadence — week view</h1>
  <p>Breakfast, gap, lunch, gap, dinner, gap. Snacks and drinks live in the gap they actually fall in, so order comes back without ever showing a clock.</p>
</div>
<div class="scroller"><div class="board" id="b"></div></div>
</div>
<script>
const DAYS=[['MON',4],['TUE',5],['WED',6],['THU',7],['FRI',8],['SAT',9],['SUN',10]];
const ROWS=[
  {k:'Breakfast', label:'Breakfast', meal:true},
  {k:'Morning',   label:'',          meal:false},
  {k:'Lunch',     label:'Lunch',     meal:true},
  {k:'Afternoon', label:'',          meal:false},
  {k:'Dinner',    label:'Dinner',    meal:true},
  {k:'Evening',   label:'',          meal:false}
];
const P=[
 {Breakfast:[['Greek yogurt bowl',420,32,44,12,'meal']],
  Morning:[['Cold brew',120,2,18,4,'out']],
  Lunch:[['Chicken shawarma bowl',620,48,58,20,'meal']],
  Afternoon:[['Protein shake',180,25,12,3,'snack']],
  Dinner:[['Salmon and rice',640,45,62,22,'meal']], Evening:[]},
 {Breakfast:[['Overnight oats',410,24,52,12,'meal']], Morning:[],
  Lunch:[['Turkey chili',560,42,48,18,'meal']],
  Afternoon:[['Protein bar and apple',240,20,30,6,'snack']],
  Dinner:[['Steak and sweet potato',690,52,55,26,'meal']], Evening:[]},
 {Breakfast:[['Eggs and sourdough',450,28,40,18,'meal']],
  Morning:[['Cold brew',120,2,18,4,'out']],
  Lunch:[['Chipotle bowl',700,45,72,24,'out']], Afternoon:[],
  Dinner:[['Chicken shawarma bowl',620,48,58,20,'meal']], Evening:[]},
 {Breakfast:[['Greek yogurt bowl',420,32,44,12,'meal']], Morning:[],
  Lunch:[['Turkey chili',560,42,48,18,'meal']], Afternoon:[],
  Dinner:[['Salmon and rice',740,50,70,26,'meal']], Evening:[]},
 {Breakfast:[['Overnight oats',410,24,52,12,'meal']], Morning:[],
  Lunch:[['Chicken salad',480,40,24,24,'meal']], Afternoon:[],
  Dinner:[['Dinner with Sam',1100,35,90,48,'out']], Evening:[]},
 {Breakfast:[['Eggs and avocado toast',480,26,38,24,'meal']], Morning:[],
  Lunch:[['Leftover chili',520,38,44,18,'meal']], Afternoon:[],
  Dinner:[['Steak and sweet potato',700,52,56,26,'meal']],
  Evening:[['Glass of wine',125,0,4,0,'out']]},
 {Breakfast:[['Overnight oats',410,24,52,12,'meal']], Morning:[],
  Lunch:[['Chicken shawarma bowl',620,48,58,20,'meal']],
  Afternoon:[['Greek yogurt',230,22,18,4,'snack']],
  Dinner:[['Salmon and rice',640,45,62,22,'meal']],
  Evening:[['Kombucha',60,0,14,0,'out']]}
];
const TGT={k:1900,p:150,c:185,f:62}, TOL={k:120,p:15,c:30,f:12};

let g=`<div class="mast"><h3>Cadence</h3><span>WEEK 27 · 04–10 JUL 2026 · FAT LOSS · HIGH PROTEIN</span></div>
<div class="rule2"></div><div class="grid">`;
g+=`<div class="dh"></div>`+DAYS.map(d=>`<div class="dh">${d[0]}<b>${String(d[1]).padStart(2,'0')} JUL</b></div>`).join('');

ROWS.forEach((r,ri)=>{
  g+=`<div class="lbl${r.meal?'':' gap'}">${r.label}</div>`;
  P.forEach(day=>{
    const items=day[r.k]||[];
    g+=`<div class="cell${r.meal?'':' gap'}">`;
    if(r.meal && !items.length) g+=`<div class="empty"></div>`;
    items.forEach(m=>{g+=`<div class="ev ${m[5]}">
      <div class="n">${m[0]}</div>
      <div class="kc">${m[1].toLocaleString()}</div>
      <div class="mc">${m[2]}P &nbsp;${m[3]}C &nbsp;${m[4]}F</div></div>`});
    g+=`</div>`;
  });
  if(ri<ROWS.length-1) g+=`<div class="sp"></div>`.repeat(8);
});
g+=`</div>`;

const s=P.reduce((a,d)=>{ROWS.forEach(r=>(d[r.k]||[]).forEach(m=>{a[0]+=m[1];a[1]+=m[2];a[2]+=m[3];a[3]+=m[4]}));return a},[0,0,0,0]);
const av=s.map(x=>Math.round(x/7));
const COL=[['Calories',av[0],TGT.k,TOL.k,''],['Protein',av[1],TGT.p,TOL.p,' g'],
           ['Carbs',av[2],TGT.c,TOL.c,' g'],['Fat',av[3],TGT.f,TOL.f,' g']];
g+=`<div class="foot"><div class="tbl">
  <div class="hd"></div>`+COL.map(c=>`<div class="hd">${c[0]}</div>`).join('')+`
  <div class="rl">Daily average</div>`+COL.map(c=>`<div class="r-avg">${c[1].toLocaleString()}${c[4]}</div>`).join('')+`
  <div class="rl q">Target</div>`+COL.map(c=>`<div class="r-tgt">${c[2].toLocaleString()}${c[4]}</div>`).join('')+`
  <div class="rl q">Difference</div>`+COL.map(c=>{const d=c[1]-c[2],ok=Math.abs(d)<=c[3];
    return `<div class="r-dif ${ok?'ok':'off'}">${d>0?'+':'−'}${Math.abs(d)}${c[4]}</div>`}).join('')+`
</div></div>`;
document.getElementById('b').innerHTML=g;
</script>
</body></html>
