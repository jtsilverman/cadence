<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>You're on the list — Cadence</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* shared site styles (inlined so each page is self-contained) */
/* cadence — validation site, board aesthetic. Archivo + IBM Plex Mono, cream, radius 0. */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#EFEDE6; --card:#FBFAF5; --ink:#101010; --grn:#576860; --rust:#AF4A28;
  --dim:#8A8A83; --rule:#B5B1A3; --edge:#D6D2C5;
  --matte:#576860;
  --ease:cubic-bezier(.2,0,0,1);
  --navh:74px;
}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:Archivo,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
a{color:inherit}

/* ---------- nav: links left, name and logo centered, CTA right ---------- */
.nav{position:sticky;top:0;z-index:50;background:var(--cream);border-bottom:1px solid var(--edge)}
.nav--static{position:static}
.nav-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:var(--navh);max-width:none;padding:0 22px}
.nav-links{display:flex;gap:24px}
.nav-link{font-size:16.5px;font-weight:600;letter-spacing:.02em;color:#3c3c38;text-decoration:none}
.nav-link:hover{color:var(--ink)}
.brand{display:flex;align-items:center;gap:10px;justify-self:center;text-decoration:none;color:var(--ink)}
.brand svg{display:block}
.brand span{font-size:18px;font-weight:700;letter-spacing:.34em;text-transform:uppercase}
.nav-cta{justify-self:end}

/* ---------- buttons ---------- */
.btn{display:inline-block;background:var(--matte);color:var(--cream);border:0;cursor:pointer;
  font-family:Archivo,sans-serif;font-size:14px;font-weight:600;letter-spacing:.04em;
  padding:13px 24px;text-decoration:none;transition:background .15s var(--ease)}
.btn:hover{background:#49584F}
.btn--big{padding:21px 42px;font-size:19px}
.btn--nav{padding:13px 23px;font-size:15.5px}
.btn[disabled]{opacity:.55;cursor:default}
.cta-note{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.06em;color:var(--dim);margin-top:14px}

/* ---------- type helpers ---------- */
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;color:var(--dim)}
.lede{font-size:18.5px;line-height:1.6;color:#3c3c38}

/* ---------- hero ---------- */
.hero{padding:104px 0 96px;text-align:center}
.hero h1{font-size:62px;font-weight:600;letter-spacing:-.035em;line-height:1.02;max-width:14ch;margin:0 auto}
.hero .sub{font-size:18px;line-height:1.62;color:#3c3c38;max-width:54ch;margin:28px auto 36px}
@media(max-width:760px){.hero h1{font-size:42px}}

/* ---------- how-it-works kicker ---------- */
.kicker{border-top:2px solid var(--ink);padding:26px 0 0;text-align:left}

/* ---------- statement close ---------- */
.statement{padding:130px 0 120px;text-align:center;border-top:2px solid var(--ink)}
.statement h2{font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1.1;max-width:22ch;margin:0 auto}
.statement .lede{max-width:58ch;margin:24px auto 40px}
.statement .qlink{display:inline-block;margin-top:26px;font-family:'IBM Plex Mono',monospace;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-decoration:none}
.statement .qlink:hover{color:var(--ink)}

/* ---------- footer: one honest row ---------- */
.footer{border-top:2px solid var(--ink)}
.footer-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;
  padding:24px 22px;max-width:none;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;color:var(--dim)}
.footer .wm{font-family:Archivo,sans-serif;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  font-size:12.5px;color:var(--ink)}
.footer-inner>:first-child{justify-self:start}.footer-inner>:nth-child(2){justify-self:center}.footer-inner>:last-child{justify-self:end}
.footer a{color:var(--dim);text-decoration:none}
.footer a:hover{color:var(--ink)}

/* ---------- page head (faq / waitlist / thanks) ---------- */
.page-head{padding:88px 0 34px}
.page-head h1{font-size:56px;font-weight:600;letter-spacing:-.03em}
.page-head .lede{margin-top:16px;max-width:56ch}

/* ---------- faq accordion ---------- */
.faq-list{max-width:780px;margin:26px 0 0;border-top:2px solid var(--ink)}
.faq-item{border-bottom:1px dotted var(--rule)}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:20px;
  padding:21px 0;background:none;border:0;cursor:pointer;text-align:left;
  font-family:Archivo,sans-serif;font-size:19px;font-weight:600;color:var(--ink)}
.faq-toggle{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--dim);flex:none}
.faq-panel{max-height:0;overflow:hidden;transition:max-height .4s var(--ease)}
.faq-panel p{padding:0 0 24px;max-width:66ch}
.ask{max-width:780px;margin:64px 0 100px}
.ask h2{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-bottom:14px}
.sent-note{font-size:16.5px;color:var(--matte);font-weight:600}
.err-note{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--rust);margin-left:14px}

/* ---------- forms ---------- */
.txt,textarea{background:var(--card);border:1px solid var(--edge);color:var(--ink);
  font-family:Archivo,sans-serif;font-size:16.5px;padding:14px 15px;width:100%}
.txt:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
textarea{resize:vertical;line-height:1.5}
.txt::placeholder,textarea::placeholder{color:var(--dim)}
.blk{margin:36px 0;border:0}
.blk>.eyebrow{display:block;margin-bottom:13px}
.opts{display:flex;flex-direction:column}
.opt{display:flex;align-items:center;gap:11px;padding:7px 0;cursor:pointer;font-size:16.5px;color:#2c2c28}
.vh{position:absolute;opacity:0;pointer-events:none}
.box{width:13px;height:13px;border:1px solid var(--ink);flex:none;display:grid;place-items:center}
.box i{width:7px;height:7px;background:var(--matte);display:none}
.opt input:checked ~ .box i{display:block}
.opt input:focus-visible ~ .box{outline:2px solid var(--ink);outline-offset:2px}
.form-col{max-width:640px;padding-bottom:110px}
.signup-email{max-width:420px}
.form-sub{margin:30px 0 0;font-size:16.5px;color:var(--dim)}

/* ---------- thanks ---------- */
.thanks{padding:140px 0 160px}
.thanks h1{font-size:56px;font-weight:600;letter-spacing:-.03em}
.thanks .lede{margin-top:22px;max-width:54ch}
.thanks a{color:var(--ink)}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:0s !important;animation:none !important;scroll-behavior:auto}
}

</style>
</head><body>

<header class="nav nav--static">
  <div class="wrap nav-inner">
    <nav class="nav-links" aria-label="Site">
      <a class="nav-link" href="index.html#how">How it works</a>
      <a class="nav-link" href="faq.html">Questions</a>
    </nav>
    <a class="brand" href="index.html" aria-label="Cadence home">
      <svg width="56" height="28" viewBox="0 0 120 60" fill="none" stroke="currentColor" stroke-width="6" aria-hidden="true">
        <path d="M8 12 V48"/><path d="M38 12 V48"/><path d="M62 12 V48"/><path d="M80 12 V48"/><path d="M94 4 V56" stroke-width="8"/>
      </svg>
      <span>Cadence</span>
    </a>
    <div class="nav-cta"></div>
  </div>
</header>

<section class="thanks">
  <div class="wrap">
    <h1>You&rsquo;re on the list.</h1>
    <p class="lede">Curious what this actually is? The <a href="faq.html">questions</a> page has straight answers.</p>
  </div>
</section>

<footer class="footer">
  <div class="wrap footer-inner">
    <span class="wm">Cadence</span>
    <span>© 2026 Cadence Health</span>
    <a href="mailto:hello@cadence.app">hello@cadence.app</a>
  </div>
</footer>

</body></html>
